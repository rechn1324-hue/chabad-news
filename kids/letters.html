<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בלוני האותיות · איזור הילדים</title>
<meta name="description" content="מפוצצים את הבלונים עם האות הנכונה לפני שהזמן נגמר – ומנסים לשבור את השיא של כולם!">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="kids.css">
<style>
  .topline { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .target { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 20px; padding: 4px 14px; box-shadow: var(--press); }
  .target .big { font-family: var(--font-fun); font-weight: 700; font-size: 2.6rem; line-height: 1.1; color: var(--tomato); min-width: 1.1em; text-align: center; }
  .target .lbl { font-size: .95rem; line-height: 1.25; }
  .target .lbl b { font-family: var(--font-fun); font-size: 1.25rem; display: block; }
  .say { border: 0; background: var(--sky); border-radius: 999px; width: 42px; height: 42px; font-size: 1.25rem; cursor: pointer; }
  .topline .hud { margin: 0; }
  .chip.low b { color: var(--bad); }
  .sky { width: min(100%, 760px); background: linear-gradient(180deg, #8fd0ff, #dff2ff 70%, #b8ec9c 70.5%, #9ad97b); touch-action: none; }
  .balloon { position: absolute; top: 0; left: 0; width: var(--bw, 84px); height: var(--bh, 104px); border: 0; padding: 0; background: none; cursor: pointer; will-change: transform; touch-action: none; -webkit-tap-highlight-color: transparent; }
  .balloon .body { position: absolute; inset: 0 0 18% 0; border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.65) 0 10%, transparent 11%), var(--c);
    display: flex; align-items: center; justify-content: center; font-family: var(--font-fun); font-weight: 700; font-size: calc(var(--bw, 84px) * .5); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.15); box-shadow: inset -8px -10px 0 rgba(0,0,0,.08); }
  .balloon .knot { position: absolute; left: 50%; bottom: 11%; width: 12px; height: 10px; margin-left: -6px; background: var(--c); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .balloon .str { position: absolute; left: 50%; bottom: -26px; width: 2px; height: 38px; background: rgba(26,35,80,.45); }
  .balloon.pop .body { animation: pop .28s forwards; }
  .balloon.pop .knot, .balloon.pop .str { opacity: 0; }
  .balloon.wrong .body { animation: shake .35s; }
  @keyframes pop { to { transform: scale(1.6); opacity: 0; } }
  @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-5px); } }
  .sun { position: absolute; top: 18px; inset-inline-start: 22px; width: 64px; height: 64px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 10px rgba(255,210,63,.35); }
  .ftxt { position: absolute; z-index: 2; pointer-events: none; font-family: var(--font-fun); font-weight: 700; font-size: 1.3rem; color: var(--good); text-shadow: 0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff; transform: translate(-50%, 0); animation: rise .9s ease-out forwards; white-space: nowrap; }
  .ftxt.bad { color: var(--bad); }
  .ftxt.big { font-size: 1.8rem; color: var(--ocean); }
  @keyframes rise { to { transform: translate(-50%, -60px); opacity: 0; } }
  .modes { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .modes .kbtn { font-size: 1rem; padding: 9px 16px; }
  .modes .kbtn[aria-pressed="true"] { background: var(--tomato); color: #fff; }
</style>
</head>
<body class="play">
<header class="kbar">
  <div class="kwrap kbar-row">
    <a class="kback" href="./">→ כל המשחקים</a>
    <h1>בלוני האותיות</h1>
    <button class="ksound" id="sound" type="button">🔊</button>
  </div>
</header>

<main class="kwrap game-main">
  <div class="topline">
    <div class="target" aria-live="polite">
      <span class="big" id="t-letter">א</span>
      <span class="lbl">פוצצו את<b id="t-name">אל״ף</b></span>
      <button class="say" id="say" type="button" aria-label="השמעת שם האות" hidden>🗣️</button>
    </div>
    <div class="hud">
      <span class="chip">⭐ <b id="score">0</b></span>
      <span class="chip" id="time-chip">⏱ <b id="time">60</b></span>
      <span class="chip">עוד <b id="left">4</b></span>
      <button class="chip" id="pause-btn" type="button" aria-label="הפסקה">⏸</button>
    </div>
  </div>
  <div class="stage sky" id="sky">
    <span class="sun" aria-hidden="true"></span>
    <div class="overlay" id="ov-start">
      <h2>בלוני האותיות 🎈</h2>
      <p>בלונים עם אותיות עפים לשמיים. פוצצו רק את הבלונים עם האות שלמעלה – מהר, לפני שהשעון נגמר!</p>
      <p class="how">כל אות שגומרים (4 בלונים) = עוד 3 שניות. בלון לא נכון = מינוס 2 שניות.</p>
      <div class="modes" role="group" aria-label="אילו אותיות">
        <button class="kbtn white" data-mode="first" type="button" aria-pressed="true">א׳–י׳</button>
        <button class="kbtn white" data-mode="all" type="button" aria-pressed="false">כל האותיות</button>
        <button class="kbtn white" data-mode="finals" type="button" aria-pressed="false">אותיות סופיות</button>
      </div>
      <button class="kbtn" id="start" type="button">מתחילים!</button>
      <p class="records-line" id="best-start"></p>
    </div>
    <div class="overlay" id="ov-pause" hidden>
      <h2>הפסקה קטנה</h2>
      <button class="kbtn" id="resume" type="button">ממשיכים</button>
    </div>
  </div>
</main>

<script src="kids.js"></script>
<script src="leaderboard.js"></script>
<script>
(function () {
  'use strict';
  var K = window.Kids, B = window.Board, GAME = 'letters';
  var ALL = [['א', 'אל״ף'], ['ב', 'בי״ת'], ['ג', 'גימ״ל'], ['ד', 'דל״ת'], ['ה', 'ה״א'], ['ו', 'וי״ו'], ['ז', 'זי״ן'], ['ח', 'חי״ת'], ['ט', 'טי״ת'], ['י', 'יו״ד'],
    ['כ', 'כ״ף'], ['ל', 'למ״ד'], ['מ', 'מ״ם'], ['נ', 'נו״ן'], ['ס', 'סמ״ך'], ['ע', 'עי״ן'], ['פ', 'פ״א'], ['צ', 'צד״י'], ['ק', 'קו״ף'], ['ר', 'רי״ש'], ['ש', 'שי״ן'], ['ת', 'תי״ו']];
  var FINALS = [['ך', 'כ״ף סופית'], ['ם', 'מ״ם סופית'], ['ן', 'נו״ן סופית'], ['ף', 'פ״א סופית'], ['ץ', 'צד״י סופית']];
  var MODES = {
    first: { pool: ALL.slice(0, 10), extra: [] },
    all: { pool: ALL, extra: [] },
    finals: { pool: FINALS, extra: [['כ'], ['מ'], ['נ'], ['פ'], ['צ']] },
  };
  var COLORS = ['#ff6b4a', '#2f80ff', '#2fb36d', '#7a5cff', '#ff5fa2', '#13b5a6', '#f2a705'];
  var PER_LETTER = 4, START_TIME = 60, BONUS_TIME = 3, PENALTY = 2;
  var $ = function (id) { return document.getElementById(id); };
  var sky = $('sky');
  var mode = K.load('letters-mode', 'first');
  if (!MODES[mode]) mode = 'first';
  var target = null, score = 0, left = PER_LETTER, done = 0, popped = 0, timeLeft = START_TIME;
  var balloons = [], state = 'idle', spawnT = 0, last = 0, raf = 0, order = [], bw = 84, bh = 104;
  var voice = null;

  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    var vs = speechSynthesis.getVoices();
    voice = vs.filter(function (v) { return /^he|^iw/i.test(v.lang); })[0] || null;
    $('say').hidden = !voice;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak() {
    if (!voice || !target || K.isMuted()) return;
    var u = new SpeechSynthesisUtterance(target[1].replace(/״/g, ''));
    u.voice = voice; u.lang = voice.lang; u.rate = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }

  function paintModes() {
    document.querySelectorAll('.modes [data-mode]').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.mode === mode)); });
  }
  function sizeBalloons() {
    var W = sky.clientWidth || 360;
    bw = Math.round(Math.max(64, Math.min(88, W / 4.6)));
    bh = Math.round(bw * 1.24);
    sky.style.setProperty('--bw', bw + 'px');
    sky.style.setProperty('--bh', bh + 'px');
  }
  function nextTarget() {
    var pool = MODES[mode].pool;
    if (!order.length) order = K.shuffle(pool);
    target = order.pop();
    left = PER_LETTER;
    $('t-letter').textContent = target[0];
    $('t-name').textContent = target[1];
    $('left').textContent = left;
    speak();
  }
  function letterPool() {
    var m = MODES[mode];
    return m.pool.map(function (x) { return x[0]; }).concat(m.extra.map(function (x) { return x[0]; }));
  }
  function hud() {
    $('score').textContent = score;
    var t = Math.max(0, Math.ceil(timeLeft));
    $('time').textContent = t;
    $('time-chip').classList.toggle('low', t <= 10);
  }
  function floatText(text, x, y, cls) {
    var el = document.createElement('span');
    el.className = 'ftxt' + (cls ? ' ' + cls : '');
    el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    sky.appendChild(el);
    setTimeout(function () { el.remove(); }, 950);
  }

  function spawn() {
    var W = sky.clientWidth, H = sky.clientHeight;
    var isTarget = Math.random() < 0.4 || !balloons.some(function (b) { return b.letter === target[0] && !b.dead; });
    var others = letterPool().filter(function (l) { return l !== target[0]; });
    var letter = isTarget ? target[0] : K.pick(others);
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'balloon';
    el.style.setProperty('--c', K.pick(COLORS));
    el.setAttribute('aria-label', 'בלון ' + letter);
    el.innerHTML = '<span class="body">' + letter + '</span><span class="knot"></span><span class="str"></span>';
    var x = 6 + Math.random() * Math.max(10, W - bw - 12);
    var speedUp = 1 + Math.min(1.3, score * 0.022);
    var b = { el: el, x: x, y: H + 20, v: (H / 7.5) * speedUp * (0.85 + Math.random() * 0.3), letter: letter, sway: Math.random() * 6, dead: false };
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); hit(b); });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hit(b); } });
    sky.appendChild(el);
    balloons.push(b);
  }

  function hit(b) {
    if (state !== 'run' || b.dead) return;
    var cx = b.x + bw / 2, cy = b.y + bh * 0.3;
    if (b.letter === target[0]) {
      b.dead = true;
      b.el.classList.add('pop');
      K.sfx.pop();
      score++; left--; popped++;
      floatText(K.ltr('+1'), cx, cy);
      setTimeout(function () { b.el.remove(); }, 300);
      if (left <= 0) {
        done++;
        score += 2;
        timeLeft += BONUS_TIME;
        K.sfx.win();
        floatText('אות שלמה! ' + K.ltr('+2') + ' ⭐ ' + K.ltr('+' + BONUS_TIME) + ' ⏱', sky.clientWidth / 2, sky.clientHeight * 0.35, 'big');
        nextTarget();
      } else $('left').textContent = left;
      hud();
    } else {
      K.sfx.bad(); K.vibrate(60);
      timeLeft = Math.max(0, timeLeft - PENALTY);
      floatText(K.ltr('−' + PENALTY) + ' ⏱', cx, cy, 'bad');
      b.el.classList.remove('wrong'); void b.el.offsetWidth; b.el.classList.add('wrong');
      hud();
    }
  }

  function loop(now) {
    raf = 0;
    var dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (state !== 'run') return;
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; hud(); return gameOver(); }
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.42, 1.05 - score * 0.012); }
    for (var i = balloons.length - 1; i >= 0; i--) {
      var b = balloons[i];
      if (!b.dead) b.y -= b.v * dt;
      b.sway += dt * 2;
      b.el.style.transform = 'translate(' + (b.x + Math.sin(b.sway) * 10).toFixed(1) + 'px,' + b.y.toFixed(1) + 'px)';
      if (b.y < -bh - 40) { b.el.remove(); balloons.splice(i, 1); }
      else if (b.dead && !b.el.isConnected) balloons.splice(i, 1);
    }
    hud();
    raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } }

  function clearBalloons() { balloons.forEach(function (b) { b.el.remove(); }); balloons = []; }
  function start() {
    K.audio();
    B.close();
    K.unfocus();
    clearBalloons();
    sizeBalloons();
    score = 0; done = 0; popped = 0; order = []; timeLeft = START_TIME;
    $('ov-start').hidden = true; $('ov-pause').hidden = true;
    nextTarget();
    hud();
    state = 'run'; spawnT = 0;
    kick();
  }
  function gameOver() {
    state = 'over';
    K.sfx.over();
    var sc = score;
    var isNew = sc > B.best(GAME);
    setTimeout(function () {
      clearBalloons();
      B.showResult({
        game: GAME, score: sc,
        title: isNew ? 'שיא חדש!' : sc > 0 ? K.pick(['כל הכבוד!', 'יישר כוח!', 'אלופי האותיות!']) : 'עוד ניסיון?',
        text: 'פוצצתם ' + popped + ' בלונים נכונים וגמרתם ' + done + ' אותיות.',
        stars: sc >= 60 ? 3 : sc >= 30 ? 2 : 1,
        onAgain: start,
        extra: [{ label: 'בחירת אותיות', onClick: function () { state = 'idle'; $('ov-start').hidden = false; } }],
      });
      B.startLine(GAME, $('best-start'));
    }, 500);
  }
  function pause() {
    if (state !== 'run') return;
    state = 'pause';
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    $('ov-pause').hidden = false;
  }
  function resume() {
    if (state !== 'pause') return;
    state = 'run';
    $('ov-pause').hidden = true;
    kick();
  }

  document.querySelector('.modes').addEventListener('click', function (e) {
    var b = e.target.closest('[data-mode]');
    if (!b) return;
    mode = b.dataset.mode;
    K.save('letters-mode', mode);
    paintModes();
    K.sfx.tick();
  });
  $('start').addEventListener('click', start);
  $('resume').addEventListener('click', resume);
  $('say').addEventListener('click', speak);
  $('pause-btn').addEventListener('click', function () { if (state === 'run') pause(); else resume(); });
  document.addEventListener('keydown', function (e) {
    if (B.isOpen() || K.typing(e)) return;
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { if (state === 'run') pause(); else resume(); return; }
    // במקלדת עברית: הקלדת האות מפוצצת את הבלון הנכון הנמוך ביותר
    if (state === 'run' && target && e.key === target[0]) {
      var low = null;
      balloons.forEach(function (b) { if (!b.dead && b.letter === target[0] && b.y < sky.clientHeight - bh * 0.5 && (!low || b.y > low.y)) low = b; });
      if (low) { hit(low); e.preventDefault(); }
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });
  window.addEventListener('resize', sizeBalloons);

  paintModes();
  sizeBalloons();
  B.startLine(GAME, $('best-start'));
})();
</script>
</body>
</html>
